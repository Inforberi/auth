basePath: /api/v1/
definitions:
  httpx.ErrorResponse:
    properties:
      code:
        example: invalid_json
        type: string
      message:
        example: invalid json
        type: string
    type: object
  password_http.LoginByEmailRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  password_http.LoginByEmailResponse:
    properties:
      status:
        type: string
    type: object
  password_http.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  password_http.RegisterResponse:
    properties:
      userID:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Financial Intelligence API
  title: Auth API
  version: "1.0"
paths:
  /auth/login/email:
    post:
      consumes:
      - application/json
      description: login by email/password
      parameters:
      - description: login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.LoginByEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.LoginByEmailResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            invalid_credentials'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: login by email
      tags:
      - Auth
  /auth/register/email:
    post:
      consumes:
      - application/json
      description: Creates a new user account using email/password.
      parameters:
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/password_http.RegisterResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            password_too_short, password_too_long, password_no_letter, password_no_digit,
            password_no_upper_letter'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'code: email_already_exists'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register by email
      tags:
      - Auth
schemes:
- http
swagger: "2.0"
