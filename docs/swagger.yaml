basePath: /
definitions:
  dev.SendMailRequest:
    properties:
      body:
        example: Local SMTP test
        type: string
      subject:
        example: Test email
        type: string
      to:
        example: user@example.com
        type: string
    required:
    - body
    - subject
    - to
    type: object
  dev.SendMailResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  httpx.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  password_http.ChangePasswordRequest:
    properties:
      confirmPassword:
        example: ExamplePass2
        type: string
      newPassword:
        example: ExamplePass2
        type: string
      oldPassword:
        example: ExamplePass1
        type: string
    required:
    - confirmPassword
    - newPassword
    - oldPassword
    type: object
  password_http.ChangePasswordResponse:
    properties:
      Status:
        example: ok
        type: string
    type: object
  password_http.LoginByEmailRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: ExamplePass1
        type: string
    required:
    - email
    - password
    type: object
  password_http.LoginByEmailResponse:
    properties:
      status:
        type: string
    type: object
  password_http.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: ExamplePass1
        type: string
    required:
    - email
    - password
    type: object
  password_http.RegisterResponse:
    properties:
      userID:
        type: string
    type: object
  router.HealthResponse:
    properties:
      status:
        type: string
    type: object
info:
  contact: {}
  description: Reusable authentication service. Cookie sessions require HTTPS. CSRF
    protection is a later release prerequisite.
  title: Auth API
  version: "1.0"
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Requires a valid __Host-session cookie. Missing or rejected sessions
        return 401. Response retains the legacy uppercase Status field. CSRF/fresh-auth
        checks and atomic SQL session revocation are not implemented yet. New-password
        policy failures currently return 500 internal_error; this mapping is a lifecycle
        follow-up.
      parameters:
      - description: change password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.ChangePasswordResponse'
        "400":
          description: 'codes: invalid_json, password_mismatch, invalid_email_or_password,
            same_password, empty_new_password, empty_old_password, empty_confirm_password'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: 'code: unauthorized'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: 'code: not_found'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: change password
      tags:
      - Auth
  /api/v1/auth/login/email:
    post:
      consumes:
      - application/json
      description: Sets the Secure, HttpOnly, SameSite=Lax __Host-session cookie on
        success. HTTPS is required for browser sessions. Invalid credentials return
        400, not 401. Account status/auth-version checks and CSRF enforcement are
        not implemented yet.
      parameters:
      - description: login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.LoginByEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.LoginByEmailResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            invalid_credentials'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: login by email
      tags:
      - Auth
  /api/v1/auth/register/email:
    post:
      consumes:
      - application/json
      description: Creates an account and sets the Secure, HttpOnly, SameSite=Lax
        __Host-session cookie. HTTPS is required for browser sessions. Email is normalized
        and limited to 255 bytes; password is 8-128 bytes with a letter, digit and
        uppercase letter. Email verification and CSRF enforcement are not implemented
        yet.
      parameters:
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/password_http.RegisterResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            password_too_short, password_too_long, password_no_letter, password_no_digit,
            password_no_upper_letter'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'code: email_already_exists'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register by email
      tags:
      - Auth
  /api/v1/dev/send-mail:
    post:
      consumes:
      - application/json
      description: Dev-only endpoint for manual SMTP testing. Available only when
        APP_ENV=dev.
      parameters:
      - description: mail payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.SendMailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dev.SendMailResponse'
        "400":
          description: 'codes: invalid_json, to_required, subject_required, body_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: send_failed'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Send test email
      tags:
      - Dev
  /health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.HealthResponse'
      summary: Process liveness
      tags:
      - Health
  /health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/router.HealthResponse'
      summary: PostgreSQL and Redis readiness
      tags:
      - Health
  /ping:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Legacy process ping
      tags:
      - Health
schemes:
- https
- http
swagger: "2.0"
