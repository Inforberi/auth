basePath: /api/v1/
definitions:
  dev.SendMailRequest:
    properties:
      body:
        type: string
      subject:
        type: string
      to:
        type: string
    type: object
  dev.SendMailResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  httpx.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  password_http.ChangePasswordRequest:
    properties:
      confirmPassword:
        type: string
      newPassword:
        type: string
      oldPassword:
        type: string
    type: object
  password_http.ChangePasswordResponse:
    properties:
      status:
        type: string
    type: object
  password_http.LoginByEmailRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  password_http.LoginByEmailResponse:
    properties:
      status:
        type: string
    type: object
  password_http.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  password_http.RegisterResponse:
    properties:
      userID:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Financial Intelligence API
  title: Auth API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: change password
      parameters:
      - description: change password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.ChangePasswordResponse'
        "400":
          description: 'codes: invalid_json, password_mismatch, invalid_email_or_password,
            same_password, empty_new_password, empty_old_password, empty_confirm_password'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: 'code: unauthorized'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: 'code: not_found'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: change password
      tags:
      - Auth
  /auth/login/email:
    post:
      consumes:
      - application/json
      description: login by email/password
      parameters:
      - description: login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.LoginByEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.LoginByEmailResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            invalid_credentials'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: login by email
      tags:
      - Auth
  /auth/register/email:
    post:
      consumes:
      - application/json
      description: Creates a new user account using email/password.
      parameters:
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/password_http.RegisterResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            password_too_short, password_too_long, password_no_letter, password_no_digit,
            password_no_upper_letter'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'code: email_already_exists'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register by email
      tags:
      - Auth
  /dev/send-mail:
    post:
      consumes:
      - application/json
      description: Dev-only endpoint for manual SMTP testing. Available only when
        APP_ENV=dev.
      parameters:
      - description: mail payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.SendMailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dev.SendMailResponse'
        "400":
          description: 'codes: invalid_json, to_required, subject_required, body_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: send_failed'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Send test email
      tags:
      - Dev
schemes:
- http
swagger: "2.0"
