basePath: /api/v1/
definitions:
  httpx.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  password_http.LoginByEmailRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  password_http.LoginByEmailResponse:
    properties:
      status:
        type: string
    type: object
  password_http.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  password_http.RegisterResponse:
    properties:
      userID:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Financial Intelligence API
  title: Auth API
  version: "1.0"
paths:
  /auth/login/email:
    post:
      consumes:
      - application/json
      description: login by email/password
      parameters:
      - description: login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.LoginByEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.LoginByEmailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: login by email
      tags:
      - Auth
  /auth/register/email:
    post:
      consumes:
      - application/json
      description: Creates a new user account using email/password
      parameters:
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/password_http.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register by email
      tags:
      - Auth
schemes:
- http
swagger: "2.0"
