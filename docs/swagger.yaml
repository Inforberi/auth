basePath: /
definitions:
  account_http.ConfirmRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  account_http.ResendRequest:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  account_http.VerificationResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  dev.SendMailRequest:
    properties:
      body:
        example: Local SMTP test
        type: string
      subject:
        example: Test email
        type: string
      to:
        example: user@example.com
        type: string
    required:
    - body
    - subject
    - to
    type: object
  dev.SendMailResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  httpx.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  password_http.ChangePasswordRequest:
    properties:
      confirmPassword:
        example: ExamplePass2
        type: string
      newPassword:
        example: ExamplePass2
        type: string
      oldPassword:
        example: ExamplePass1
        type: string
    required:
    - confirmPassword
    - newPassword
    - oldPassword
    type: object
  password_http.ChangePasswordResponse:
    properties:
      Status:
        example: ok
        type: string
    type: object
  password_http.ForgotRequest:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  password_http.LoginByEmailRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: ExamplePass1
        type: string
    required:
    - email
    - password
    type: object
  password_http.LoginByEmailResponse:
    properties:
      status:
        type: string
    type: object
  password_http.RecoveryResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  password_http.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: ExamplePass1
        type: string
    required:
    - email
    - password
    type: object
  password_http.RegisterResponse:
    properties:
      userID:
        type: string
    type: object
  password_http.ResetRequest:
    properties:
      confirmPassword:
        example: ExamplePass2
        type: string
      newPassword:
        example: ExamplePass2
        type: string
      token:
        type: string
    required:
    - confirmPassword
    - newPassword
    - token
    type: object
  router.HealthResponse:
    properties:
      status:
        type: string
    type: object
info:
  contact: {}
  description: Reusable authentication service. Cookie sessions require HTTPS. CSRF
    protection is a later release prerequisite.
  title: Auth API
  version: "1.0"
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Requires a valid SQL-backed __Host-session and a verified login
        email. Atomically updates password, revokes all sessions and records audit;
        sign in again. Response retains legacy uppercase Status. CSRF/fresh-auth are
        not implemented yet.
      parameters:
      - description: change password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.ChangePasswordResponse'
        "400":
          description: 'codes: password_policy, invalid_json, password_mismatch, invalid_email_or_password,
            same_password, empty_new_password, empty_old_password, empty_confirm_password'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: 'code: unauthorized'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: email_not_verified'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: 'code: not_found'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: change password
      tags:
      - Auth
  /api/v1/auth/email/resend:
    post:
      consumes:
      - application/json
      description: Always returns accepted for unknown, verified, blocked and cooldown
        addresses. Enqueues encrypted delivery for eligible addresses. Limits use
        socket peer IP; forwarded headers are not trusted.
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account_http.ResendRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/account_http.VerificationResponse'
        "400":
          description: 'codes: invalid_json, invalid_email'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Request email verification
      tags:
      - Account
  /api/v1/auth/email/verify:
    post:
      consumes:
      - application/json
      description: Consumes a 256-bit token once. Expired, replaced, replayed, blocked
        or unknown tokens share one error. Does not create a session. POST only; opening
        an email link must not confirm automatically.
      parameters:
      - description: token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account_http.ConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account_http.VerificationResponse'
        "400":
          description: 'codes: invalid_json, invalid_verification'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm email ownership
      tags:
      - Account
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Generic accepted response for unknown, blocked and cooldown addresses.
        Enqueues an encrypted email after SQL commit; does not guarantee delivery.
        Socket IP limits; forwarded headers are not trusted.
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ForgotRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/password_http.RecoveryResponse'
        "400":
          description: 'codes: invalid_json, invalid_email'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Request password recovery
      tags:
      - Auth
  /api/v1/auth/login/email:
    post:
      consumes:
      - application/json
      description: Sets the Secure, HttpOnly, SameSite=Lax __Host-session cookie on
        success. Unverified users can sign in, but sensitive routes require a verified
        email. HTTPS is required for browser sessions. Invalid credentials return
        400, not 401. SQL session issuance checks current account status and auth
        version. CSRF enforcement is not implemented yet.
      parameters:
      - description: login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.LoginByEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.LoginByEmailResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            invalid_credentials'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: login by email
      tags:
      - Auth
  /api/v1/auth/register/email:
    post:
      consumes:
      - application/json
      description: Creates an account, queues email verification atomically and sets
        the Secure, HttpOnly, SameSite=Lax __Host-session cookie. Unverified accounts
        can sign in but cannot change their password. HTTPS is required for browser
        sessions. Email is normalized and limited to 255 bytes; password is 8-128
        bytes with a letter, digit and uppercase letter. CSRF enforcement is not implemented
        yet.
      parameters:
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/password_http.RegisterResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            password_too_short, password_too_long, password_no_letter, password_no_digit,
            password_no_upper_letter'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'code: email_already_exists'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register by email
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: 'Single-use 256-bit token. SQL commit atomically updates the password,
        consumes the token, revokes all sessions and records audit. Does not verify
        email or create a session; sign in again. New password: 8-128 bytes, letter,
        digit and uppercase. POST only, never automatic GET confirmation.'
      parameters:
      - description: token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.RecoveryResponse'
        "400":
          description: 'codes: invalid_json, invalid_reset, password_mismatch, password_policy'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Reset password
      tags:
      - Auth
  /api/v1/dev/send-mail:
    post:
      consumes:
      - application/json
      description: Dev-only endpoint for manual SMTP testing. Available only when
        APP_ENV=dev.
      parameters:
      - description: mail payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.SendMailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dev.SendMailResponse'
        "400":
          description: 'codes: invalid_json, to_required, subject_required, body_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: send_failed'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Send test email
      tags:
      - Dev
  /health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.HealthResponse'
      summary: Process liveness
      tags:
      - Health
  /health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/router.HealthResponse'
      summary: PostgreSQL and Redis readiness
      tags:
      - Health
  /ping:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Legacy process ping
      tags:
      - Health
schemes:
- https
- http
swagger: "2.0"
