          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm an email proof for MFA management
      tags:
      - MFA
  /api/v1/auth/reauthenticate/email/request:
    post:
      consumes:
      - application/json
      description: Optional, existing external-only account with an active session
        and an already verified owned email. Does not attach or verify a new address,
        authenticate by password or issue a new session.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Already verified owned email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emailotp_http.RequestCodeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/emailotp_http.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'codes: invalid_origin, fresh_auth_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Request an email proof for MFA management
      tags:
      - MFA
  /api/v1/auth/reauthenticate/password:
    post:
      consumes:
      - application/json
      description: Requires current session cookie and allowed Origin. Atomically
        rotates the token and records password proof for this session only. Does not
        extend session deadlines, prove MFA or grant permissions. No old-token grace
        period; serialize requests around reauthentication. Lost successful response
        requires login. Password and token never returned in JSON.
      parameters:
      - description: Exact HTTPS origin from AUTH_ALLOWED_ORIGINS
        in: header
        name: Origin
        required: true
        type: string
      - description: current password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ReauthenticationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.ReauthenticationResponse'
        "400":
          description: 'code: invalid_json'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: 'codes: unauthorized, fresh_auth_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm current password for sensitive actions
      tags:
      - Session
  /api/v1/auth/register/email:
    post:
      consumes:
      - application/json
      description: Enforces current public method/registration policy. Required email
        verification returns 201 with verificationRequired=true and no session cookie.
        Optional queues verification and issues a session; disabled does not queue
        automatic verification or mark the address verified. Account and queued mail
        commit atomically; session issuance is separate, so an error does not prove
        account rollback. A committed retry returns 409, never automatic login. HTTPS
        and allowed Origin are required.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/password_http.RegisterResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            password_too_short, password_too_long, password_no_letter, password_no_digit,
            password_no_upper_letter'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'codes: invalid_origin, registration_disabled'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: 'code: method_disabled'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'code: email_already_exists'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register by email
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: 'Single-use 256-bit token. SQL commit atomically updates the password,
        consumes the token, revokes all sessions and records audit. Does not verify
        email or create a session; sign in again. New password: 8-128 bytes, letter,
        digit and uppercase. POST only, never automatic GET confirmation.'
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.RecoveryResponse'
        "400":
          description: 'codes: invalid_json, invalid_reset, password_mismatch, password_policy'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Reset password
      tags:
      - Auth
  /api/v1/auth/session/activity:
    post:
      description: Call only after user interaction, never from polling or timers
        alone. Administrative sessions use a stored bounded idle window; ordinary
        sessions are unchanged. Does not renew primary, password or MFA proof or the
        absolute deadline. No body or client timestamps.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ActivityResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Report interactive session activity
      tags:
      - Sessions
  /api/v1/auth/session/rotate:
    post:
      description: Requires an allowed Origin and the current session cookie. Replaces
        the token once without extending deadlines or refreshing authentication. Concurrent
        rotations have one winner; serialize browser requests around rotation. A lost
        successful response requires a new login. No old-token grace period.
      parameters:
      - description: Exact HTTPS origin from AUTH_ALLOWED_ORIGINS
        in: header
        name: Origin
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Rotate the current session token
      tags:
      - Session
  /api/v1/auth/sessions:
    get:
      description: Up to 50 items ordered by creation time and public UUID descending;
        pass nextCursor as before. No session secrets are returned.
      parameters:
      - description: Public session UUID cursor
        in: query
        name: before
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.SessionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List own active sessions
      tags:
      - Session
  /api/v1/auth/sessions/{id}:
    delete:
      description: Foreign, unknown and inactive sessions share 404. Revoking current
        session also clears the cookie. Requires an allowed Origin.
      parameters:
      - description: Exact HTTPS origin from AUTH_ALLOWED_ORIGINS
        in: header
        name: Origin
        required: true
        type: string
      - description: Public session UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Revoke one own active session
      tags:
      - Session
  /api/v1/auth/telegram/callback:
    get:
      description: Provider redirect bound to single-use state, PKCE, nonce and flow
        cookie. Login sets __Host-session; linking requires the unchanged fresh session
        and never creates or replaces it. No email auto-merge. Restart after a failed
        or lost callback.
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: Single-use state
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/oidchttp.CallbackResponse'
        "202":
          description: MFA required; browser binding cookie, no session issued
          schema:
            $ref: '#/definitions/internal_auth_methods_telegram_transport_http.MFAChallengeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'codes: fresh_auth_required, registration_disabled'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: 'code: method_disabled'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: identity_conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Complete Telegram OIDC login
      tags:
      - Auth
  /api/v1/auth/telegram/link:
    delete:
      description: Requires Origin and fresh password proof. A verified permanent
        password login must remain. Successful unlink increments auth_version and
        revokes all sessions, including the caller. Unknown ownership is not revealed.
      parameters:
      - description: Allowed browser origin
        in: header
        name: Origin
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: 'code: method_disabled'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Unlink Telegram from the current account
      tags:
      - Account
    post:
      description: Requires current session, exact Origin, verified email with permanent
        password and recent password reauthentication. Flow binds UUID and session
        hash; callback does not create a session or user. One identity per provider
        per account.
      parameters:
      - description: Allowed browser origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth_methods_telegram_transport_http.StartResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: 'code: method_disabled'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Start linking Telegram to the current account
      tags:
      - Account
  /api/v1/auth/telegram/start:
    post:
      description: Requires allowed Origin. Sets a browser-bound HttpOnly flow cookie;
        navigate to authorizationUrl. Disabled by default.
      parameters:
      - description: Allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/oidchttp.StartResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Start Telegram OIDC login
      tags:
      - Auth
  /api/v1/auth/temporary-password/complete:
    post:
      consumes:
      - application/json
      description: Optional temporary password profile. Consumes a one-time setup
        token and revokes temporary credentials atomically. Does not create a session,
        verify email, bypass MFA or grant roles. Use ordinary login afterwards. GET
        never changes credentials.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: setup token and permanent password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.TemporaryCompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.RecoveryResponse'
        "400":
          description: 'codes: invalid_json, invalid_temporary_password, password_mismatch,
            password_policy, same_password'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Set a permanent password after temporary login
      tags:
      - Auth
  /api/v1/auth/temporary-password/login:
    post:
      consumes:
      - application/json
      description: Optional temporary password profile. Returns only a short-lived
        password-setup token, never a session cookie. Repeated successful login replaces
        the previous setup token. Does not verify email or grant product access. Shares
        ordinary login rate limits.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: email and temporary password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.TemporaryLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.TemporaryLoginResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            invalid_temporary_password'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Begin mandatory password setup
      tags:
      - Auth
  /api/v1/auth/token/exchange:
    post:
      consumes:
      - application/json
      description: Requires exact allowed Origin and a live completed cookie session.
        Does not refresh the session or MFA. Scope is restricted by the configured
        audience and current SQL grants. Strict tokens still require an online authority
        decision at the consumer.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: audience and permission keys
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/token_http.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token_http.ExchangeResponse'
        "400":
          description: invalid_json, invalid_token_request, ambiguous_credentials
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: invalid_origin, forbidden, email_not_verified, mfa_required
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: rate_limited
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: temporarily_unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Issue an access JWT from the current cookie session
      tags:
      - Tokens
  /api/v1/auth/token/logout:
    post:
      consumes:
      - application/json
      description: Native JSON credential only; no Origin/Cookie/Authorization/query.
        Repeated or unknown well-formed refresh returns 204. A known current or spent
        credential revokes only its own family; never logout-all. Does not remove
        reuse history. Local JWTs remain valid until their published expiry window;
        strict consumers require online authority.
      parameters:
      - description: Opaque refresh credential
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/token_http.RefreshRequest'
      responses:
        "204":
          description: Logged out
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Revoke the native refresh family and its API session
      tags:
      - Native tokens
  /api/v1/auth/token/refresh:
    post:
      consumes:
      - application/json
      description: Native JSON credential only; no Origin/Cookie/Authorization/query.
        Single-flight required. Replay of a known spent credential commits family/session
        revocation before 401. No retry/grace on lost responses. First rotation can
        be immediate, later >=30s; 4096 credentials/family, then sign in again. Does
        not extend absolute lifetime, scope or assurance.
      parameters:
      - description: Current opaque refresh credential
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/token_http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token_http.NativeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Rotate native refresh and issue an access token
      tags:
      - Native tokens
  /api/v1/dev/send-mail:
    post:
      consumes:
      - application/json
      description: Dev-only endpoint for manual SMTP testing. Available only when
        APP_ENV=dev.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: mail payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.SendMailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dev.SendMailResponse'
        "400":
          description: 'codes: invalid_json, to_required, subject_required, body_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: send_failed'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Send test email
      tags:
      - Dev
  /api/v1/internal/auth/token/introspect:
    post:
      consumes:
      - application/json
      description: Service-to-service HTTPS only. Dedicated per-consumer HTTP Basic
        credentials, not user Bearer/cookies. Invalid/inactive tokens return only
        active:false. Does not renew sessions. Custom protocol, not RFC 7662.
      parameters:
      - description: Basic service client ID and secret
        in: header
        name: Authorization
        required: true
        type: string
      - description: Full access JWT
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/token_http.IntrospectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token_http.IntrospectionResponse'
        "400":
          description: invalid_json
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: unauthorized_service
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: rate_limited
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: temporarily_unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Check an access JWT against current session authority
      tags:
      - Tokens
  /api/v1/setup/complete:
    post:
      consumes:
      - application/json
      description: Consumes installation proof and pending intent with email and TOTP
        codes. Atomically creates account, verified contact, factor, recovery codes,
        system grant and durable initialized marker. Returns recovery codes once;
        does not issue a session. Setup stays closed after restart or loss of administrator.
      parameters:
      - description: Installation operator proof
        in: header
        name: X-Setup-Token
        required: true
        type: string
