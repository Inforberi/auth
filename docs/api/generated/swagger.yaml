info:
  contact: {}
  description: Reusable authentication service. Cookie sessions require HTTPS. All
    auth mutations require an exact allowed Origin. CORS is opt-in; cookie profile
    is same-site.
  title: Auth API
  version: "1.0"
paths:
  /api/v1/admin/permissions:
    get:
      description: Requires current access.roles.manage or access.assignments.manage.
        Returns declared keys, not an ability to create arbitrary permissions through
        HTTP.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.PermissionCatalogResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read the project's permission catalog
      tags:
      - Admin Access
  /api/v1/admin/roles:
    get:
      description: Requires current roles.manage or assignments.manage. Keyset pagination,
        no count or per-role permission queries. A full page returns its last key
        as nextAfter; a final empty page may be necessary. Use role detail for permissions.
      parameters:
      - description: Exclusive last role key
        in: query
        name: after
        type: string
      - default: 50
        description: Page size, 1..100, default 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.RolePageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List role metadata
      tags:
      - Admin Access
    post:
      consumes:
      - application/json
      description: Requires access.roles.manage, all delegated permissions and fresh
        password plus MFA in the mutation transaction. No system role or wildcard
        bypass. Duplicate key returns conflict; no automatic assignments.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Custom role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/access_http.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/access_http.RoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Create a custom role
      tags:
      - Admin Access
  /api/v1/admin/roles/{id}:
    get:
      description: Requires current access.roles.manage or access.assignments.manage.
        Includes version for a subsequent explicit edit or assignment. Reads do not
        renew session or authentication freshness.
      parameters:
      - description: Role UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.RoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read a role and its permissions
      tags:
      - Admin Access
    post:
      consumes:
      - application/json
      description: Full definition, not a patch. Requires access.roles.manage, old
        and new delegated permissions, fresh password plus MFA and current role version
        in one transaction. A no-op preserves the version; system roles cannot be
        changed.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Role UUID
        in: path
        name: id
        required: true
        type: string
      - description: Definition and expected version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/access_http.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.RoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Replace a custom role's definition
      tags:
      - Admin Access
  /api/v1/admin/users/{id}/access:
    get:
      description: Requires current access.assignments.manage. UUID lookup only, no
        user enumeration. One SQL statement checks actor session/permission and reads
        the target. Unknown/deleted target and unauthorized actor share forbidden.
        Pending/blocked targets may have assignments but cannot exercise permissions.
        accessVersion is for assignment concurrency, not permission caching.
      parameters:
      - description: Target user UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.AccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read a user's role assignments and permission union
      tags:
      - Admin Access
  /api/v1/admin/users/{id}/email-binding:
    post:
      consumes:
      - application/json
      description: Requires accounts.email.bind and fresh password plus MFA in SQL.
        Explicit target UUID, active external-only account without contacts. Sends
        a code but does not reserve/attach the address, create an account or bypass
        the owner's MFA. Approval expires no later than the administrator's current
        authentication proof.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Target user UUID
        in: path
        name: id
        required: true
        type: string
      - description: Email approved for this user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.EmailBindingRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/http.EmailBindingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Approve a user's initial email binding
      tags:
      - Admin Users
  /api/v1/admin/users/{id}/roles/{roleId}:
    delete:
      consumes:
      - application/json
      description: JSON body is required also for DELETE. Same permission/delegation/version/password/MFA
        transaction guard as grant. Self-revoke of a custom role is allowed; system
        role cannot be revoked. Subsequent authorization uses current SQL assignments.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Target user UUID
        in: path
        name: id
        required: true
        type: string
      - description: Role UUID
        in: path
        name: roleId
        required: true
        type: string
      - description: Expected role and user assignment versions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/access_http.AssignmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.AssignmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Revoke a custom role from a user
      tags:
      - Admin Access
    post:
      consumes:
      - application/json
      description: Requires access.assignments.manage, all delegated role permissions,
        current role/access versions and fresh password plus MFA in one transaction.
        No self-grant or system-role assignment. Pending users receive access only
        after activation. Retry with stale versions returns conflict; a current no-op
        preserves the version.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Target user UUID
        in: path
        name: id
        required: true
        type: string
      - description: Role UUID
        in: path
        name: roleId
        required: true
        type: string
      - description: Expected role and user assignment versions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/access_http.AssignmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.AssignmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Assign a custom role to a user
      tags:
      - Admin Access
  /api/v1/auth/access:
    get:
      description: Current SQL role IDs, known permissions and assignment version,
        for this authenticated user only. The version is not a cache key for role
        contents. This response helps UI presentation; the backend must authorize
        every protected operation itself.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.AccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read my effective permissions
      tags:
      - Access
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Requires a valid SQL-backed __Host-session, verified login email,
        allowed Origin and current password. Atomically updates password, revokes
        all sessions and records audit; sign in again. Response retains legacy uppercase
        Status. MFA is not implemented.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: change password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.ChangePasswordResponse'
        "400":
          description: 'codes: password_policy, invalid_json, password_mismatch, invalid_email_or_password,
            same_password, empty_new_password, empty_old_password, empty_confirm_password'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: 'code: unauthorized'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'codes: invalid_origin, email_not_verified'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: 'code: not_found'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: change password
      tags:
      - Auth
  /api/v1/auth/email-otp/confirm:
    post:
      consumes:
      - application/json
      description: Requires the requesting browser flow cookie, eight decimal digits,
        allowed Origin, current status/version/email and at most five failed guesses
        per challenge. One-time consumption then ordinary SQL session issuance; not
        MFA or password reauthentication.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emailotp_http.ConfirmCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emailotp_http.StatusResponse'
        "202":
          description: MFA required; browser binding cookie, no session issued
          schema:
            $ref: '#/definitions/mfa_http.ChallengeResponse'
        "400":
          description: 'codes: invalid_json, invalid_email_login'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Sign in with a one-time email code
      tags:
      - Email OTP
  /api/v1/auth/email-otp/request:
    post:
      consumes:
      - application/json
      description: Optional profile, existing active account with verified current
        password email only. Generic accepted response; sets a browser-bound HttpOnly
        flow cookie. Does not register, verify email or create a session.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emailotp_http.RequestCodeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/emailotp_http.StatusResponse'
        "400":
          description: 'codes: invalid_json, invalid_email'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Request a passwordless email login code
      tags:
      - Email OTP
  /api/v1/auth/email/binding/confirm:
    post:
      consumes:
      - application/json
      description: Requires the target's live session, mailed eight-digit code and
        fresh MFA if a factor is enrolled. Rechecks the approving administrator's
        current password/MFA/session/permission in SQL. Atomically creates a verified
        contact, raises auth_version, revokes all target sessions and records audit.
        Does not create login authority or merge accounts.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Code from the approved email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.ConfirmEmailBindingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account_http.VerificationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm the owner's initial email binding
      tags:
      - Account
  /api/v1/auth/email/change:
    post:
      consumes:
      - application/json
      description: Optional EMAIL_CHANGE_ENABLED profile. Requires a valid session,
        allowed Origin, verified current login email and either current password or
        recent session-bound password reauthentication. Omit password after successful
        reauthentication; a supplied wrong password is always rejected. Old email
        remains active until confirmation. Sends separate confirmation and security
        links; no tokens returned.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: new email, optional current password when already reauthenticated
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account_http.EmailChangeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/account_http.VerificationResponse'
        "400":
          description: 'codes: invalid_json, invalid_email, invalid_email_change'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: 'codes: unauthorized, fresh_auth_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'code: email_change_pending'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Request a login email change
      tags:
      - Account
  /api/v1/auth/email/change/confirm:
    post:
      consumes:
      - application/json
      description: Optional profile. Explicit POST with a purpose-bound one-time token.
        Original session must still be valid. Claims new email, revokes all sessions
        and sends old-address notice atomically. No session created; GET links never
        mutate state.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: confirmation token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account_http.EmailChangeConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account_http.VerificationResponse'
        "400":
          description: 'codes: invalid_json, invalid_email_change'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: 'code: fresh_auth_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm a login email change
      tags:
      - Account
  /api/v1/auth/email/change/recover:
    post:
      consumes:
      - application/json
      description: Optional password-only profile. Distinct single-use token delivered
        to the old verified address after protective blocking. Atomically replaces
        the compromised password, restores that address, revokes access and invalidates
        previous protection links before activating the account. Does not bypass administrative
        blocking, create a session or run on GET.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: recovery token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ProtectedRecoveryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.RecoveryResponse'
        "400":
          description: 'codes: invalid_json, invalid_account_recovery, password_mismatch,
            password_policy, same_password'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Recover an account after an unauthorized email change
      tags:
      - Auth
  /api/v1/auth/email/change/report:
    post:
      consumes:
      - application/json
      description: Optional profile. Explicit POST with a distinct old-verified-address
        one-time token; does not require the compromised session. Cancels pending
        change and revokes sessions, or blocks the account after completion. Never
        rolls back email, unblocks or signs in automatically. Protected recovery remains
        a separate release gate.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: security token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account_http.EmailChangeReportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account_http.VerificationResponse'
        "400":
          description: 'codes: invalid_json, invalid_email_change'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Report an unauthorized email change
      tags:
      - Account
  /api/v1/auth/email/resend:
    post:
      consumes:
      - application/json
      description: Always returns accepted for unknown, verified, blocked and cooldown
        addresses. Enqueues encrypted delivery for eligible addresses. Limits use
        socket peer IP; forwarded headers are not trusted.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account_http.ResendRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/account_http.VerificationResponse'
        "400":
          description: 'codes: invalid_json, invalid_email'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Request email verification
      tags:
      - Account
  /api/v1/auth/email/verify:
    post:
      consumes:
      - application/json
      description: Consumes a 256-bit token once. Expired, replaced, replayed, blocked
        or unknown tokens share one error. Does not create a session. POST only; opening
        an email link must not confirm automatically.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account_http.ConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account_http.VerificationResponse'
        "400":
          description: 'codes: invalid_json, invalid_verification'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm email ownership
      tags:
      - Account
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Generic accepted response for unknown, blocked and cooldown addresses.
        Enqueues an encrypted email after SQL commit; does not guarantee delivery.
        Socket IP limits; forwarded headers are not trusted.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ForgotRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/password_http.RecoveryResponse'
        "400":
          description: 'codes: invalid_json, invalid_email'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Request password recovery
      tags:
      - Auth
  /api/v1/auth/google/callback:
    get:
      description: Provider redirect bound to single-use state, PKCE, nonce and flow
        cookie. Login sets __Host-session; linking requires the unchanged fresh session
        and never creates or replaces it. No email auto-merge. Restart after a failed
        or lost callback.
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: Single-use state
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth_methods_google_transport_http.CallbackResponse'
        "202":
          description: MFA required; browser binding cookie, no session issued
          schema:
            $ref: '#/definitions/internal_auth_methods_google_transport_http.MFAChallengeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: fresh_auth_required
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: identity_conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Complete Google OIDC login
      tags:
      - Auth
  /api/v1/auth/google/link:
    delete:
      description: Requires Origin and fresh password proof. A verified permanent
        password login must remain. Successful unlink increments auth_version and
        revokes all sessions, including the caller. Unknown ownership is not revealed.
      parameters:
      - description: Allowed browser origin
        in: header
        name: Origin
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Unlink Google from the current account
      tags:
      - Account
    post:
      description: Requires current session, exact Origin, verified email with permanent
        password and recent password reauthentication. Flow binds UUID and session
        hash; callback does not create a session or user. One identity per provider
        per account.
      parameters:
      - description: Allowed browser origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth_methods_google_transport_http.StartResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Start linking Google to the current account
      tags:
      - Account
  /api/v1/auth/google/start:
    post:
      description: Requires allowed Origin. Sets a browser-bound HttpOnly flow cookie;
        navigate to authorizationUrl. Disabled by default.
      parameters:
      - description: Allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth_methods_google_transport_http.StartResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Start Google OIDC login
      tags:
      - Auth
  /api/v1/auth/invitations/activate:
    post:
      consumes:
      - application/json
      description: Optional invitation profile. Consumes a distinct one-time token,
        sets a password and verifies the invited contact atomically. Expired, replayed,
        blocked and unknown tokens have one error. Does not create a session or assign
        roles. GET never activates an account.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: invitation token and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ActivationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.RecoveryResponse'
        "400":
          description: 'codes: invalid_json, invalid_invitation, password_mismatch,
            password_policy'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Activate an invited password account
      tags:
      - Auth
  /api/v1/auth/login/email:
    post:
      consumes:
      - application/json
      description: Sets the Secure, HttpOnly, SameSite=Lax __Host-session cookie on
        success. Unverified users can sign in, but sensitive routes require a verified
        email. HTTPS and an allowed Origin are required. Invalid credentials return
        400, not 401. SQL session issuance checks current account status and auth
        version.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.LoginByEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.LoginByEmailResponse'
        "202":
          description: MFA required; browser binding cookie, no session issued
          schema:
            $ref: '#/definitions/mfa_http.ChallengeResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            invalid_credentials'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited; Retry-After: 60'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: login by email
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Missing or invalid sessions return 401 and clear the stale cookie.
        Dependency failures do not clear it. Requires an allowed Origin.
      parameters:
      - description: Exact HTTPS origin from AUTH_ALLOWED_ORIGINS
        in: header
        name: Origin
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Revoke current session and clear browser cookie
      tags:
      - Session
  /api/v1/auth/logout-all:
    post:
      description: Requires an allowed Origin. Auth version increment prevents stale
        in-flight issuance.
      parameters:
      - description: Exact HTTPS origin from AUTH_ALLOWED_ORIGINS
        in: header
        name: Origin
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Revoke all own sessions including current and clear browser cookie
      tags:
      - Session
  /api/v1/auth/me:
    get:
      description: Requires __Host-session cookie. Returns IDs only; profile and contact
        management are separate features.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get authenticated user and current session IDs
      tags:
      - Session
  /api/v1/auth/mfa/login/complete:
    post:
      consumes:
      - application/json
      description: Requires the same browser binding cookie and allowed Origin. Consumes
        TOTP/recovery and challenge atomically with SQL session issuance. No client
        UUID, auth version or MFA timestamp is accepted.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: challenge and second factor
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/mfa_http.CompleteLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mfa_http.StatusResponse'
        "400":
          description: 'codes: invalid_json, invalid_mfa'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Complete login with a second factor
      tags:
      - MFA
  /api/v1/auth/mfa/recovery-codes/regenerate:
    post:
      description: Requires fresh primary and MFA proofs. Primary is password, or
        opt-in verified-email proof for an external-only account. Replaces all recovery
        codes, returns ten new codes once and revokes sessions/pending challenges
        atomically. TOTP remains enabled.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mfa_http.RecoveryCodesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Regenerate recovery codes
      tags:
      - MFA
  /api/v1/auth/mfa/recovery/complete:
    post:
      consumes:
      - application/json
      description: Requires the same primary challenge/browser, exact current operator-approved
        request and new TOTP. Rechecks method/status/version/operator identity and
        membership. Atomically replaces factor/recovery codes, revokes sessions and
        records audit/durable verified-contact notification. Returns codes once, clears
        old cookies, never issues a session or disables MFA. Expired, unapproved,
        cancelled, foreign and replayed requests share invalid_mfa. Five wrong codes
        exhaust the request and account guessing budget is shared with normal MFA
        login. Missing verified contact requires independent operator notification.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: request, primary challenge and new TOTP
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/mfa_http.CompleteRecoveryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mfa_http.RecoveryCodesResponse'
        "400":
          description: 'codes: invalid_json, invalid_mfa'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: route absent when disabled
          schema:
            type: string
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Complete operator-assisted MFA replacement
      tags:
      - MFA
  /api/v1/auth/mfa/recovery/start:
    post:
      consumes:
      - application/json
      description: Opt-in MFA_RECOVERY_ENABLED. Requires a live primary login challenge,
        its single browser cookie and allowed Origin, not a session. Returns a new
        candidate once; old MFA stays active. Reissue discards old approval without
        extending the primary TTL. Independent owner verification and CLI approval
        are required before completion. No user UUID, actor, version or approved flag
        accepted.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: primary login challenge
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/mfa_http.StartRecoveryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mfa_http.RecoveryCandidateResponse'
        "400":
          description: 'codes: invalid_json, invalid_mfa'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: route absent when disabled
          schema:
            type: string
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Request operator-assisted MFA replacement
      tags:
      - MFA
  /api/v1/auth/mfa/step-up:
    post:
      consumes:
      - application/json
      description: Requires fresh password proof, or opt-in verified-email proof for
        an external-only account, within five minutes. Consumes TOTP/recovery, rotates
        the current session verifier and records fresh MFA context atomically. Does
        not extend session lifetime.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: second factor
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/mfa_http.StepUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mfa_http.StepUpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm a fresh second factor
      tags:
      - MFA
  /api/v1/auth/mfa/totp:
    delete:
      description: Requires fresh primary and MFA proofs. Primary is password, or
        opt-in verified-email proof for an external-only account. Administrative-role
        policy cannot be bypassed. Removes recovery codes, raises auth_version and
        revokes all sessions atomically.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mfa_http.StatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'codes: invalid_origin, fresh_auth_required, mfa_required_by_policy'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Disable TOTP for the current account
      tags:
      - MFA
  /api/v1/auth/mfa/totp/enrollment:
    post:
      description: Requires an active session and fresh password proof, or opt-in
        verified-email proof for an external-only account, within five minutes. Returns
        the secret once in a no-store owner response. Does not enable MFA before confirmation.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mfa_http.EnrollmentResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'codes: invalid_origin, fresh_auth_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'code: mfa_conflict'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Start TOTP enrollment
      tags:
      - MFA
  /api/v1/auth/mfa/totp/enrollment/confirm:
    post:
      consumes:
      - application/json
      description: Consumes the first code, returns ten recovery codes once, raises
        auth_version and revokes all sessions atomically. Sign in again with MFA;
        no session is created here.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: enrollment token and first code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/mfa_http.ConfirmEnrollmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mfa_http.RecoveryCodesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm TOTP enrollment
      tags:
      - MFA
  /api/v1/auth/mfa/totp/replacement:
    post:
      description: Requires fresh primary and MFA proofs. Primary is password, or
        opt-in verified-email proof for an external-only account. The current factor
        remains usable until confirmation. Replacement cannot use an ordinary enrollment
        token.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mfa_http.EnrollmentResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Start protected TOTP replacement
      tags:
      - MFA
  /api/v1/auth/mfa/totp/replacement/confirm:
    post:
      consumes:
      - application/json
      description: Requires the unchanged fresh primary/MFA session, replacement token
        and a code from the new factor. Primary is password, or opt-in verified-email
        proof for an external-only account. Replaces secret/recovery codes, raises
        auth_version and revokes all sessions atomically.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: replacement token and new-factor code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/mfa_http.ConfirmEnrollmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mfa_http.RecoveryCodesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm protected TOTP replacement
      tags:
      - MFA
  /api/v1/auth/reauthenticate/email/confirm:
    post:
      consumes:
      - application/json
      description: Same owner/session/version and one-time flow cookie; rotates the
        existing session token atomically without extending lifetime. Grants a five-minute
        email proof, not password proof, MFA proof or administrative permissions.
        Existing MFA is still required to replace or disable a factor.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Eight-digit email code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emailotp_http.ConfirmCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emailotp_http.EmailProofResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm an email proof for MFA management
      tags:
      - MFA
  /api/v1/auth/reauthenticate/email/request:
    post:
      consumes:
      - application/json
      description: Optional, existing external-only account with an active session
        and an already verified owned email. Does not attach or verify a new address,
        authenticate by password or issue a new session.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Already verified owned email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emailotp_http.RequestCodeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/emailotp_http.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'codes: invalid_origin, fresh_auth_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Request an email proof for MFA management
      tags:
      - MFA
  /api/v1/auth/reauthenticate/password:
    post:
      consumes:
      - application/json
      description: Requires current session cookie and allowed Origin. Atomically
        rotates the token and records password proof for this session only. Does not
        extend session deadlines, prove MFA or grant permissions. No old-token grace
        period; serialize requests around reauthentication. Lost successful response
        requires login. Password and token never returned in JSON.
      parameters:
      - description: Exact HTTPS origin from AUTH_ALLOWED_ORIGINS
        in: header
        name: Origin
        required: true
        type: string
      - description: current password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ReauthenticationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.ReauthenticationResponse'
        "400":
          description: 'code: invalid_json'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: 'codes: unauthorized, fresh_auth_required'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Confirm current password for sensitive actions
      tags:
      - Session
  /api/v1/auth/register/email:
    post:
      consumes:
      - application/json
      description: Creates an account and queues email verification atomically, then
        creates a session and sets the Secure, HttpOnly, SameSite=Lax __Host-session
        cookie. A timeout or session error does not prove account rollback. Retrying
        an already committed registration returns 409 without a cookie; use normal
        login or password recovery, never automatic login on conflict. Unverified
        accounts can sign in but cannot change their password. HTTPS and an allowed
        Origin are required. Email is normalized and limited to 255 bytes; password
        is 8-128 bytes with a letter, digit and uppercase letter.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/password_http.RegisterResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            password_too_short, password_too_long, password_no_letter, password_no_digit,
            password_no_upper_letter'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'code: email_already_exists'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register by email
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: 'Single-use 256-bit token. SQL commit atomically updates the password,
        consumes the token, revokes all sessions and records audit. Does not verify
        email or create a session; sign in again. New password: 8-128 bytes, letter,
        digit and uppercase. POST only, never automatic GET confirmation.'
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.ResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.RecoveryResponse'
        "400":
          description: 'codes: invalid_json, invalid_reset, password_mismatch, password_policy'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Reset password
      tags:
      - Auth
  /api/v1/auth/session/rotate:
    post:
      description: Requires an allowed Origin and the current session cookie. Replaces
        the token once without extending deadlines or refreshing authentication. Concurrent
        rotations have one winner; serialize browser requests around rotation. A lost
        successful response requires a new login. No old-token grace period.
      parameters:
      - description: Exact HTTPS origin from AUTH_ALLOWED_ORIGINS
        in: header
        name: Origin
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Rotate the current session token
      tags:
      - Session
  /api/v1/auth/sessions:
    get:
      description: Up to 50 items ordered by creation time and public UUID descending;
        pass nextCursor as before. No session secrets are returned.
      parameters:
      - description: Public session UUID cursor
        in: query
        name: before
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.SessionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List own active sessions
      tags:
      - Session
  /api/v1/auth/sessions/{id}:
    delete:
      description: Foreign, unknown and inactive sessions share 404. Revoking current
        session also clears the cookie. Requires an allowed Origin.
      parameters:
      - description: Exact HTTPS origin from AUTH_ALLOWED_ORIGINS
        in: header
        name: Origin
        required: true
        type: string
      - description: Public session UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Revoke one own active session
      tags:
      - Session
  /api/v1/auth/telegram/callback:
    get:
      description: Provider redirect bound to single-use state, PKCE, nonce and flow
        cookie. Login sets __Host-session; linking requires the unchanged fresh session
        and never creates or replaces it. No email auto-merge. Restart after a failed
        or lost callback.
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: Single-use state
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/oidchttp.CallbackResponse'
        "202":
          description: MFA required; browser binding cookie, no session issued
          schema:
            $ref: '#/definitions/internal_auth_methods_telegram_transport_http.MFAChallengeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: fresh_auth_required
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: identity_conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Complete Telegram OIDC login
      tags:
      - Auth
  /api/v1/auth/telegram/link:
    delete:
      description: Requires Origin and fresh password proof. A verified permanent
        password login must remain. Successful unlink increments auth_version and
        revokes all sessions, including the caller. Unknown ownership is not revealed.
      parameters:
      - description: Allowed browser origin
        in: header
        name: Origin
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Unlink Telegram from the current account
      tags:
      - Account
    post:
      description: Requires current session, exact Origin, verified email with permanent
        password and recent password reauthentication. Flow binds UUID and session
        hash; callback does not create a session or user. One identity per provider
        per account.
      parameters:
      - description: Allowed browser origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth_methods_telegram_transport_http.StartResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Start linking Telegram to the current account
      tags:
      - Account
  /api/v1/auth/telegram/start:
    post:
      description: Requires allowed Origin. Sets a browser-bound HttpOnly flow cookie;
        navigate to authorizationUrl. Disabled by default.
      parameters:
      - description: Allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/oidchttp.StartResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Start Telegram OIDC login
      tags:
      - Auth
  /api/v1/auth/temporary-password/complete:
    post:
      consumes:
      - application/json
      description: Optional temporary password profile. Consumes a one-time setup
        token and revokes temporary credentials atomically. Does not create a session,
        verify email, bypass MFA or grant roles. Use ordinary login afterwards. GET
        never changes credentials.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: setup token and permanent password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.TemporaryCompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.RecoveryResponse'
        "400":
          description: 'codes: invalid_json, invalid_temporary_password, password_mismatch,
            password_policy, same_password'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Set a permanent password after temporary login
      tags:
      - Auth
  /api/v1/auth/temporary-password/login:
    post:
      consumes:
      - application/json
      description: Optional temporary password profile. Returns only a short-lived
        password-setup token, never a session cookie. Repeated successful login replaces
        the previous setup token. Does not verify email or grant product access. Shares
        ordinary login rate limits.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: email and temporary password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.TemporaryLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_http.TemporaryLoginResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            invalid_temporary_password'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Begin mandatory password setup
      tags:
      - Auth
