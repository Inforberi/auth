    get:
      description: Requires current accounts.users.read, not a user UUID claim or
        management permission alone. Includes stored status/versions, contact verification,
        configured password/MFA, external issuers and role metadata. Configuration
        is not a guarantee of usable login or effective access. No password hash,
        subject, token, MFA secret or recovery codes. UUID lookup also supports retained
        soft-deleted users without restoring them. Contacts/providers/roles bounded
        to 32; overflow is an explicit conflict, not silent truncation.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
