      uri:
        type: string
    type: object
  token_http.NativeMFARequest:
    properties:
      binding:
        type: string
      challenge:
        type: string
      code:
        type: string
      recovery:
        type: boolean
    required:
    - binding
    - challenge
    - code
    type: object
  token_http.NativePasswordRequest:
    properties:
      audience:
        type: string
      email:
        type: string
      password:
        type: string
      scope:
        items:
          type: string
        type: array
    required:
    - audience
    - email
    - password
    - scope
    type: object
  token_http.NativeRecoveryCodesResponse:
    properties:
      codes:
        items:
          type: string
        type: array
    type: object
  token_http.NativeResponse:
    properties:
      accessToken:
        type: string
      audience:
        type: string
      expiresAt:
        type: string
      expiresIn:
        type: integer
      refreshExpiresAt:
        type: string
      refreshToken:
        type: string
      scope:
        type: string
      tokenType:
        type: string
    type: object
  token_http.PublicKey:
    properties:
      alg:
        type: string
      crv:
        type: string
      key_ops:
        items:
          type: string
        type: array
      kid:
        type: string
      kty:
        type: string
      use:
        type: string
      x:
        type: string
      "y":
        type: string
    type: object
  token_http.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
info:
  contact: {}
  description: Reusable authentication service. Cookie sessions require HTTPS. All
    auth mutations require an exact allowed Origin. CORS is opt-in; cookie profile
    is same-site.
  title: Auth API
  version: "1.0"
paths:
  /.well-known/jwks.json:
    get:
      description: Public-only deployment key set. Contains no private signing material.
        Not an authorization decision. Keys are operator-controlled and loaded on
        startup.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token_http.JWKSResponse'
        "304":
          description: unchanged
      summary: Public JWT verification keys
      tags:
      - Tokens
    head:
      description: Public-only deployment key set. Contains no private signing material.
        Not an authorization decision. Keys are operator-controlled and loaded on
        startup.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token_http.JWKSResponse'
        "304":
          description: unchanged
      summary: Public JWT verification keys
      tags:
      - Tokens
  /api/v1/admin/auth/login/email:
    post:
      consumes:
      - application/json
      description: Requires a permanent password, verified email, enrolled MFA and
        current administrative authority. Always returns an MFA challenge, never a
        session. Complete with /api/v1/auth/mfa/login/complete. Independent of public
        login method settings; does not create an account or assign roles. Uses the
        public password login rate budget.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/password_http.LoginByEmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/mfa_http.ChallengeResponse'
        "400":
          description: 'codes: invalid_json, email_required, password_required, invalid_email,
            invalid_credentials'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: 'code: invalid_origin'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: 'code: rate_limited'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: 'code: internal_error'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'code: temporarily_unavailable'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Start administrative password and MFA login
      tags:
      - Administration
  /api/v1/admin/auth/settings:
    get:
      description: Requires a live cookie session, allowed Origin and auth.settings.manage.
        availableMethods and tokenProfiles describe this instance only, not fleet
        readiness. tokenProfiles is read-only deployment metadata; changing audience/mode
        requires coordinated rollout with consumers. No secrets/key paths/client IDs
        are returned; does not refresh the session.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_settings_http.SettingsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read authentication settings
      tags:
      - Auth settings
    post:
      consumes:
      - application/json
      description: Full non-secret authentication policy replacement, including independent
        tokenIssuance.sessionExchange/native switches. tokenProfiles/deployment keys/mode
        are not writable. Every policy boolean is required, including false. Requires
        auth.settings.manage, fresh password and MFA. expectedVersion prevents lost
        updates; adapters must be ready locally and identically configured on every
        instance. Disabling issuance does not revoke existing tokens or close introspection/logout/browser
        administration.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: complete policy and current version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_settings_http.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_settings_http.SettingsResponse'
        "400":
          description: invalid_json, invalid_auth_policy
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: forbidden, fresh_auth_required
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: auth_policy_conflict, auth_method_not_ready, last_administrator
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Replace authentication settings
      tags:
      - Auth settings
  /api/v1/admin/auth/settings/providers/{provider}:
    get:
      description: Live session, HTTPS Origin and auth.settings.manage; no fresh proof
        for reading. Presence is not a live provider test. Redirect URI and fixed
        issuer/endpoints remain deployment configuration.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Provider
        enum:
        - google
        - telegram
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/provider_settings_http.SettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read Google or Telegram client settings without the secret
      tags:
      - Provider settings
    post:
      consumes:
      - application/json
      description: Requires auth.settings.manage, fresh password+MFA and expectedVersion.
        Omitted/null secret preserves it; explicit empty clears only while the method
        is disabled. Client ID change requires explicit secret, disabled method and
        no linked identities. Rotation invalidates pending OIDC/MFA/enrollment/recovery
        proofs, not existing sessions. No external connection under SQL locks.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Provider
        enum:
        - google
        - telegram
        in: path
        name: provider
        required: true
        type: string
      - description: client ID, expectedVersion and optional new secret
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/provider_settings_http.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/provider_settings_http.SettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: provider_settings_conflict, provider_client_bound, auth_method_not_ready
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Configure or rotate Google/Telegram client credentials
      tags:
      - Provider settings
  /api/v1/admin/auth/settings/retention:
    get:
      description: Requires a live session, allowed HTTPS Origin and auth.settings.manage.
        No fresh proof is required for reading. Durations are in days; worker batch
        and interval remain deployment configuration.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/retention_settings_http.SettingsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read saved data retention periods
      tags:
      - Retention settings
    post:
      consumes:
      - application/json
      description: Requires auth.settings.manage, fresh password+MFA and expectedVersion.
        All periods must be 1..106751 days. Shortening any period requires confirmShortening=true
        and can cause irreversible deletion. Each subsequent worker batch reads current
        SQL settings; an already started batch can use the old snapshot within its
        five-second deadline. Existing session deadlines and transient challenge expiry
        do not change.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Complete retention policy and current version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/retention_settings_http.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/retention_settings_http.SettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: retention_settings_conflict, retention_confirmation_required
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Update data retention periods
      tags:
      - Retention settings
  /api/v1/admin/auth/settings/smtp:
    get:
      description: Requires a live session, HTTPS Origin and auth.settings.manage.
        passwordSet is presence only. No secrets, session refresh or network tests.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smtp_settings_http.SettingsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read SMTP settings without the password
      tags:
      - SMTP settings
    post:
      consumes:
      - application/json
      description: Requires auth.settings.manage and fresh password+MFA. Full config
        replacement, explicit requireTls. Omitted/null password preserves it; empty
        clears it only without username. Changed destination/username requires explicit
        password. SMTP_ALLOWED_TARGETS is deployment-only; production cannot disable
        TLS. No network request in this transaction.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: configuration, expectedVersion and optional password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smtp_settings_http.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smtp_settings_http.SettingsResponse'
        "400":
          description: invalid_json, invalid_smtp_settings
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: forbidden, fresh_auth_required
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: smtp_settings_conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Replace SMTP settings and optionally rotate the password
      tags:
      - SMTP settings
  /api/v1/admin/auth/settings/smtp/test:
    post:
      consumes:
      - application/json
      description: Requires auth.settings.manage and fresh password+MFA. Tests the
        authorized saved version only, after releasing SQL locks; greeting/STARTTLS/AUTH/NOOP,
        not actual delivery. Max 10 seconds, 3/user/minute and 10/project/minute,
        2 concurrent tests/instance. Does not store a readiness claim or refresh the
        session.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: saved SMTP version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smtp_settings_http.TestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smtp_settings_http.TestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: smtp_settings_conflict, smtp_connection_failed
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Test the saved SMTP connection without sending email
      tags:
      - SMTP settings
  /api/v1/admin/permissions:
    get:
      description: Requires current access.roles.manage or access.assignments.manage.
        Returns declared keys, not an ability to create arbitrary permissions through
        HTTP.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.PermissionCatalogResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read the project's permission catalog
      tags:
      - Admin Access
  /api/v1/admin/roles:
    get:
      description: Requires current roles.manage or assignments.manage. Keyset pagination,
        no count or per-role permission queries. A full page returns its last key
        as nextAfter; a final empty page may be necessary. Use role detail for permissions.
      parameters:
      - description: Exclusive last role key
        in: query
        name: after
        type: string
      - default: 50
        description: Page size, 1..100, default 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.RolePageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List role metadata
      tags:
      - Admin Access
    post:
      consumes:
      - application/json
      description: Requires access.roles.manage, all delegated permissions and fresh
        password plus MFA in the mutation transaction. No system role or wildcard
        bypass. Duplicate key returns conflict; no automatic assignments.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Custom role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/access_http.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/access_http.RoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Create a custom role
      tags:
      - Admin Access
  /api/v1/admin/roles/{id}:
    get:
      description: Requires current access.roles.manage or access.assignments.manage.
        Includes version for a subsequent explicit edit or assignment. Reads do not
        renew session or authentication freshness.
      parameters:
      - description: Role UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.RoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read a role and its permissions
      tags:
      - Admin Access
    post:
      consumes:
      - application/json
      description: Replaces the definition; omitted/null mfaRequired preserves its
        previous value for older clients. Requires access.roles.manage, old and new
        delegated permissions, fresh password plus MFA and current role version in
        one transaction. Enabling required MFA invalidates old role-bound sessions.
        A no-op preserves the version; system roles cannot be changed.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: Role UUID
        in: path
        name: id
        required: true
        type: string
      - description: Definition and expected version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/access_http.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/access_http.RoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Replace a custom role's definition
      tags:
      - Admin Access
  /api/v1/admin/users:
    get:
      description: Requires current accounts.users.read and SQL session; no fresh
        password/MFA or session renewal for this read. Newest createdAt/UUID first,
        exclusive cursor, nondeleted users only. Exact normalized email and optional
        status filters, no substring search, offset or total count. Selected display
        email prefers password contact, otherwise first retained contact by UUID.
        One bounded SQL statement checks permission and reads a page.
      parameters:
      - description: Opaque exclusive nextCursor from the previous page
        in: query
        name: before
        type: string
      - description: Account status
        enum:
        - pending
        - active
        - blocked
        in: query
        name: status
        type: string
      - description: Exact email, not a substring
        in: query
        name: email
        type: string
      - default: 50
        description: Page size 1..100, default 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account_http.UserPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List users
      tags:
      - Admin Users
    post:
      consumes:
      - application/json
      description: Requires INVITATIONS_ENABLED, MFA_ENABLED, accounts.users.manage
        and fresh password plus MFA checked in the write transaction, including replay.
        Actor comes only from the current session. UUID idempotency key is scoped
        by actor; mismatched parameters or occupied email conflict. No roles, verified
        email, password or session are granted. Replay does not resend mail or reactivate
        the account.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: UUID command key; email required when invite=true
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account_http.ProvisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Committed replay, no new invitation
          schema:
            $ref: '#/definitions/account_http.ProvisionResponse'
        "201":
          description: First successful creation
          schema:
            $ref: '#/definitions/account_http.ProvisionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
