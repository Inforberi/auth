      description: Requires MFA_ENABLED, accounts.users.delete and fresh password
        plus MFA in the deletion transaction. Actor comes only from the session. Current
        authVersion is mandatory; stale retries conflict, a retry with the current
        tombstone version is a no-op but still requires authorization. Uses existing
        atomic credential cleanup, session revocation, audit and email reservation
        policy. This is a retained tombstone, not complete PII erasure. No account
        restoration. Last system administrator is protected.
      parameters:
      - description: Exact allowed HTTPS origin
        in: header
        name: Origin
        required: true
        type: string
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
