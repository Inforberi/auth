root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -mod=readonly -trimpath -o ./tmp/auth ./cmd/auth"
delay = 1000
entrypoint = ["./tmp/auth"]
exclude_dir = ["tmp", "vendor", ".git", ".serena", "data", "backups"]
exclude_regex = ["_test\\.go$"]
include_ext = ["go", "html"]
kill_delay = "5s"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
