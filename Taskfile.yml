version: '3'

# Список команд: task --list. Настоящие .env не загружаются через source/eval.
vars:
    DEV_ENV: .env
    PROD_ENV: .env.prod
    FILE: ''
    CONFIRM: ''
    DEV_COMPOSE: 'APP_ENV_FILE={{.DEV_ENV | shellQuote}} docker compose --project-directory {{.ROOT_DIR | shellQuote}} --env-file {{.DEV_ENV | shellQuote}} -f deploy/compose.base.yml -f deploy/compose.dev.yml'
    PROD_COMPOSE: 'APP_ENV_FILE={{.PROD_ENV | shellQuote}} docker compose --project-directory {{.ROOT_DIR | shellQuote}} --env-file {{.PROD_ENV | shellQuote}} -f deploy/compose.base.yml -f deploy/compose.prod.yml'

tasks:
    default:
        desc: Показать доступные команды
        cmds:
            - task --list

    # Разработка — API с Air, PostgreSQL, Redis и Mailpit
    dev:up:
        desc: Запустить разработку с автоматической пересборкой
        aliases: [dev-up, dev]
        cmds:
            - mkdir -p tmp
            - '{{.DEV_COMPOSE}} up -d --build api'

    dev:down:
        desc: Остановить разработку, сохранив данные
        aliases: [dev-down]
        cmds:
            - '{{.DEV_COMPOSE}} down'

    dev:logs:
        desc: Показать логи API и Air
        aliases: [dev-logs]
        cmds:
            - '{{.DEV_COMPOSE}} logs -f --tail=200 api'

    dev:ps:
        desc: Показать контейнеры разработки
        cmds:
            - '{{.DEV_COMPOSE}} ps'

    # Миграции — откат только для disposable БД с подтверждением
    migrate:up:
        desc: Применить миграции разработки
        aliases: [migrate-up]
        cmds:
            - '{{.DEV_COMPOSE}} up -d --wait postgres'
            - '{{.DEV_COMPOSE}} run --rm migrate up'

    migrate:down:
        desc: Откатить одну миграцию на disposable БД
        aliases: [migrate-down]
        cmds:
            - |
                test {{.CONFIRM | shellQuote}} = dev-down || { echo 'Запуск: task migrate:down CONFIRM=dev-down'; exit 1; }
                {{.DEV_COMPOSE}} run --rm migrate down 1

    # Go — обычная проверка не дублирует vet/build/security
    check:
        desc: Проверить тесты, структуру и lint
        cmds:
            - task: go:test
            - task: go:lint

    go:test:
        internal: true
        cmds:
            - go test ./...

    go:lint:
        internal: true
        cmds:
            - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run

    go:fmt:
        desc: Отформатировать Go-код
        aliases: [fmt]
        cmds:
            - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 fmt ./cmd/... ./internal/...

    go:build:
        desc: Собрать Auth локально в bin
        cmds:
            - go build -mod=readonly -trimpath -o ./bin/auth ./cmd/auth

    # API — генерация только после изменения контракта
    swagger:
        desc: Пересобрать Swagger
        cmds:
            - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/auth/main.go --parseInternal --packageName docs -o docs/api/generated

    # Редкие проверки — отдельно по риску или перед релизом
    check:api:
        desc: Проверить воспроизводимость Swagger без изменения файлов
        cmds:
            - |
                set -eu
                api_docs=$(mktemp -d)
                trap 'rm -f "$api_docs/docs.go" "$api_docs/swagger.json" "$api_docs/swagger.yaml"; rmdir "$api_docs"' EXIT
                go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/auth/main.go --parseInternal --packageName docs -o "$api_docs"
                cmp docs/api/generated/docs.go "$api_docs/docs.go"
                cmp docs/api/generated/swagger.json "$api_docs/swagger.json"
                cmp docs/api/generated/swagger.yaml "$api_docs/swagger.yaml"

    check:security:
        desc: Проверить уязвимости Go-зависимостей
        aliases: [check-security]
        cmds:
            - go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

    check:integration:
        desc: Проверить инфраструктуру на изолированных контейнерах
        aliases: [check-integration]
        cmds:
            - bash deploy/scripts/check-integration.sh

    # PostgreSQL — production backup/restore выполнять осознанно
    db:runtime-grants:
        desc: Выдать runtime-роли права в production БД
        aliases: [db-runtime-grants]
        cmds:
            - >-
                {{.PROD_COMPOSE}} exec -T postgres sh -c
                'exec psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" "$POSTGRES_DB"'
                < deploy/runtime-grants.sql

    backup:
        desc: Создать проверяемый production backup
        aliases: [db-backup]
        cmds:
            - '{{.PROD_COMPOSE}} run --rm backup create'

    restore:
        desc: Восстановить БД — нужны FILE и CONFIRM=project:database
        aliases: [db-restore]
        cmds:
            - >-
                AUTH_ENV_FILE={{.PROD_ENV | shellQuote}}
                RESTORE_FILE={{.FILE | shellQuote}}
                RESTORE_CONFIRM={{.CONFIRM | shellQuote}}
                bash deploy/scripts/postgres-restore.sh

    # Production — команды инфраструктуры, не разрешение на релиз
    prod:up:
        desc: Запустить production profile
        aliases: [prod-up]
        cmds:
            - '{{.PROD_COMPOSE}} up -d --build api backup'

    prod:down:
        desc: Остановить production, сохранив данные
        aliases: [prod-down]
        cmds:
            - '{{.PROD_COMPOSE}} down'

    prod:logs:
        desc: Показать production логи API
        aliases: [prod-logs]
        cmds:
            - '{{.PROD_COMPOSE}} logs -f --tail=200 api'
