version: '3'

# Список команд: task --list. Настоящие .env не загружаются через source/eval.
vars:
    DEV_ENV: .env
    PROD_ENV: .env.prod
    FILE: ''
    CONFIRM: ''
    DEV_COMPOSE: 'APP_ENV_FILE={{.DEV_ENV | shellQuote}} docker compose --project-directory {{.ROOT_DIR | shellQuote}} --env-file {{.DEV_ENV | shellQuote}} -f deploy/compose.base.yml -f deploy/compose.dev.yml'
    PROD_COMPOSE: 'APP_ENV_FILE={{.PROD_ENV | shellQuote}} docker compose --project-directory {{.ROOT_DIR | shellQuote}} --env-file {{.PROD_ENV | shellQuote}} -f deploy/compose.base.yml -f deploy/compose.prod.yml'
    SANDBOX_COMPOSE: 'SANDBOX_UID=$(id -u) SANDBOX_GID=$(id -g) docker compose --project-directory {{.ROOT_DIR | shellQuote}} --env-file .env.example -p auth-sandbox -f deploy/compose.base.yml -f deploy/compose.sandbox.yml'

tasks:
    default:
        desc: Показать доступные команды
        cmds:
            - task --list

    # Изолированный HTTPS-стенд — только тестовые данные, настоящие .env не читаются
    sandbox:up:
        desc: Запустить тестовый HTTPS API на localhost:18443 и Mailpit на localhost:18026
        preconditions:
            - sh: test "$(id -u)" -ne 0
              msg: Запускайте sandbox от обычного пользователя с доступом к Docker, не от root
        deps: [sandbox:tls]
        cmds:
            - '{{.SANDBOX_COMPOSE}} up -d --wait postgres redis mailpit'
            - '{{.SANDBOX_COMPOSE}} run --rm migrate up'
            - '{{.SANDBOX_COMPOSE}} exec -T postgres psql -X -v ON_ERROR_STOP=1 -U auth -d auth < deploy/sandbox-runtime.sql'
            - '{{.SANDBOX_COMPOSE}} exec -T postgres psql -X -v ON_ERROR_STOP=1 -U auth -d auth < deploy/runtime-grants.sql'
            - '{{.SANDBOX_COMPOSE}} up -d --build --no-deps api'
            - >-
                curl --silent --show-error --fail --retry 20 --retry-all-errors --retry-connrefused --retry-delay 1
                --retry-max-time 45 --max-time 3 --cacert tmp/sandbox/tls.crt
                https://localhost:18443/health/ready

    sandbox:tls:
        internal: true
        status:
            - test -f tmp/sandbox/tls.crt -a -f tmp/sandbox/tls.key
        cmds:
            - mkdir -p tmp/sandbox
            - chmod 700 tmp/sandbox
            - >-
                sh -c 'umask 077 && exec openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256
                -noenc -days 30 -subj /CN=localhost
                -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
                -keyout tmp/sandbox/tls.key -out tmp/sandbox/tls.crt'

    sandbox:down:
        desc: Остановить HTTPS-стенд, сохранив его тестовые данные
        cmds:
            - '{{.SANDBOX_COMPOSE}} down'

    sandbox:jwt:
        desc: Включить JWT на работающем sandbox и проверить HTTPS выдачу, consumer, refresh и отзыв
        preconditions:
            - sh: test -f tmp/sandbox/admin-setup.json -a -f tmp/sandbox/tls.crt
              msg: Сначала подготовьте sandbox и тестового администратора по docs/operations/local-sandbox.md
        cmds:
            - AUTH_SANDBOX_PREPARE=1 go test ./deploy/sandbox -run '^TestPrepareJWT$' -count=1
            - '{{.SANDBOX_COMPOSE}} exec -T postgres psql -X -v ON_ERROR_STOP=1 -U auth -d auth < deploy/sandbox/jwt-fixture.sql'
            - '{{.SANDBOX_COMPOSE}} -f deploy/compose.sandbox-jwt.yml up -d --no-deps api'
            - >-
                curl --silent --show-error --fail --retry 20 --retry-all-errors --retry-connrefused --retry-delay 1
                --retry-max-time 45 --max-time 3 --cacert tmp/sandbox/tls.crt https://localhost:18443/health/ready
            - AUTH_SANDBOX_ACCEPTANCE=1 go test ./deploy/sandbox -run '^TestJWTAcceptance$' -count=1 -v -timeout=3m

    sandbox:jwt:rotation:
        desc: Проверить ротацию JWT, срок доверия к JWKS и восстановление sandbox API
        preconditions:
            - sh: test -f tmp/sandbox/jwt/private.pem -a -f tmp/sandbox/jwt/jwks.json
              msg: Сначала подготовьте работающий JWT sandbox командой task sandbox:jwt
        cmds:
            - AUTH_SANDBOX_ROTATION=1 go test ./deploy/sandbox -run '^TestJWTRotation$' -count=1 -v -timeout=5m

    sandbox:admin:
        desc: Проверить через HTTPS пользователей, приглашения, временные пароли и роли sandbox
        preconditions:
            - sh: test -f tmp/sandbox/admin-setup.json -a -f tmp/sandbox/jwt/private.pem
              msg: Нужен подготовленный JWT sandbox и тестовый администратор
        cmds:
            - AUTH_SANDBOX_ADMIN=1 go test -race ./deploy/sandbox -run '^TestAdminAcceptance$' -count=1 -v -timeout=5m

    sandbox:lifecycle:
        desc: Проверить перевыдачу приглашений и временных паролей, удаление и отзыв доступа
        preconditions:
            - sh: test -f tmp/sandbox/admin-setup.json -a -f tmp/sandbox/jwt/private.pem
              msg: Нужен подготовленный JWT sandbox и тестовый администратор
        cmds:
            - AUTH_SANDBOX_LIFECYCLE=1 go test -race ./deploy/sandbox -run '^TestLifecycleAcceptance$' -count=1 -v -timeout=5m

    sandbox:security:
        desc: Проверить реальное истечение fresh-auth и обязательный MFA по роли
        preconditions:
            - sh: test -f tmp/sandbox/admin-setup.json -a -f tmp/sandbox/jwt/private.pem
              msg: Нужен подготовленный JWT sandbox и тестовый администратор
        cmds:
            - AUTH_SANDBOX_SECURITY=1 go test -race ./deploy/sandbox -run '^TestSecurityAcceptance$' -count=1 -v -timeout=10m

    sandbox:load:
        desc: Замерить ограниченный HTTP baseline sandbox без ослабления лимитов
        preconditions:
            - sh: test -f tmp/sandbox/admin-setup.json -a -f tmp/sandbox/jwt/private.pem
              msg: Нужен подготовленный JWT sandbox и тестовый администратор
        cmds:
            - AUTH_SANDBOX_LOAD=1 go test ./deploy/sandbox -run '^TestLoadAcceptance$' -count=1 -v -timeout=8m

    sandbox:load:rest:
        desc: Проверить повторные циклы нагрузки и отдыха с RSS и диагностикой Go runtime
        preconditions:
            - sh: test -f tmp/sandbox/admin-setup.json -a -f tmp/sandbox/jwt/private.pem
              msg: Нужен подготовленный JWT sandbox и тестовый администратор
        cmds:
            - AUTH_SANDBOX_LOAD_REST=1 go test ./deploy/sandbox -run '^TestLoadRestAcceptance$' -count=1 -v -timeout=14m

    sandbox:cleanup:
        desc: Проверить штатную очистку тестового backlog под HTTP нагрузкой
        preconditions:
            - sh: test -f tmp/sandbox/admin-setup.json -a -f tmp/sandbox/jwt/private.pem
              msg: Нужен подготовленный JWT sandbox и тестовый администратор
        cmds:
            - AUTH_SANDBOX_CLEANUP=1 go test ./deploy/sandbox -run '^TestCleanupAcceptance$' -count=1 -v -timeout=8m

    # Разработка — API с Air, PostgreSQL, Redis и Mailpit
    dev:up:
        desc: Запустить разработку с автоматической пересборкой
        aliases: [dev-up, dev]
        cmds:
            - mkdir -p tmp
            - '{{.DEV_COMPOSE}} up -d --build api'

    dev:down:
        desc: Остановить разработку, сохранив данные
        aliases: [dev-down]
        cmds:
            - '{{.DEV_COMPOSE}} down'

    dev:logs:
        desc: Показать логи API и Air
        aliases: [dev-logs]
        cmds:
            - '{{.DEV_COMPOSE}} logs -f --tail=200 api'

    dev:ps:
        desc: Показать контейнеры разработки
        cmds:
            - '{{.DEV_COMPOSE}} ps'

    # Миграции — откат только для disposable БД с подтверждением
    migrate:up:
        desc: Применить миграции разработки
        aliases: [migrate-up]
        cmds:
            - '{{.DEV_COMPOSE}} up -d --wait postgres'
            - '{{.DEV_COMPOSE}} run --rm migrate up'

    migrate:down:
        desc: Откатить одну миграцию на disposable БД
        aliases: [migrate-down]
        cmds:
            - |
                test {{.CONFIRM | shellQuote}} = dev-down || { echo 'Запуск: task migrate:down CONFIRM=dev-down'; exit 1; }
                {{.DEV_COMPOSE}} run --rm migrate down 1

    # Go — обычная проверка не дублирует vet/build/security
    check:
        desc: Проверить тесты, структуру и lint
        cmds:
            - task: go:test
            - task: go:lint

    go:test:
        internal: true
        cmds:
            - go test ./...

    go:lint:
        internal: true
        cmds:
            - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run

    go:fmt:
        desc: Отформатировать Go-код
        aliases: [fmt]
        cmds:
            - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 fmt ./cmd/... ./internal/... ./pkg/...

    go:build:
        desc: Собрать Auth локально в bin
        cmds:
            - go build -mod=readonly -trimpath -o ./bin/auth ./cmd/auth

    # Доступы — preview каталога без изменения ролей и БД
    access:preview:
        desc: Проверить JSON-каталог разрешений и показать изменения
        vars:
            CURRENT: ''
        cmds:
            - 'go run ./cmd/access-catalog -file {{.FILE | shellQuote}} -current {{.CURRENT | shellQuote}}'

    # API — генерация только после изменения контракта
    swagger:
        desc: Пересобрать Swagger
        cmds:
            - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/auth/main.go --parseInternal --packageName docs -o docs/api/generated

    # Редкие проверки — отдельно по риску или перед релизом
    check:api:
        desc: Проверить воспроизводимость Swagger без изменения файлов
        cmds:
            - |
                set -eu
                api_docs=$(mktemp -d)
                trap 'rm -f "$api_docs/docs.go" "$api_docs/swagger.json" "$api_docs/swagger.yaml"; rmdir "$api_docs"' EXIT
                go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/auth/main.go --parseInternal --packageName docs -o "$api_docs"
                cmp docs/api/generated/docs.go "$api_docs/docs.go"
                cmp docs/api/generated/swagger.json "$api_docs/swagger.json"
                cmp docs/api/generated/swagger.yaml "$api_docs/swagger.yaml"

    check:security:
        desc: Проверить уязвимости Go-зависимостей
        aliases: [check-security]
        cmds:
            - go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

    check:integration:
        desc: Проверить инфраструктуру на изолированных контейнерах
        aliases: [check-integration]
        cmds:
            - bash deploy/scripts/check-integration.sh

    # PostgreSQL — production backup/restore выполнять осознанно
    db:runtime-grants:
        desc: Выдать runtime-роли права в production БД
        aliases: [db-runtime-grants]
        cmds:
            - >-
                {{.PROD_COMPOSE}} exec -T postgres sh -c
                'exec psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" "$POSTGRES_DB"'
                < deploy/runtime-grants.sql

    backup:
        desc: Создать проверяемый production backup
        aliases: [db-backup]
        cmds:
            - '{{.PROD_COMPOSE}} run --rm backup create'

    restore:
        desc: Восстановить БД без запуска API — FILE и CONFIRM=project:database; затем security recovery
        aliases: [db-restore]
        cmds:
            - >-
                AUTH_ENV_FILE={{.PROD_ENV | shellQuote}}
                RESTORE_FILE={{.FILE | shellQuote}}
                RESTORE_CONFIRM={{.CONFIRM | shellQuote}}
                bash deploy/scripts/postgres-restore.sh

    # Production — команды инфраструктуры, не разрешение на релиз
    prod:up:
        desc: Запустить production profile
        aliases: [prod-up]
        cmds:
            - '{{.PROD_COMPOSE}} up -d --build api backup'

    prod:down:
        desc: Остановить production, сохранив данные
        aliases: [prod-down]
        cmds:
            - '{{.PROD_COMPOSE}} down'

    prod:logs:
        desc: Показать production логи API
        aliases: [prod-logs]
        cmds:
            - '{{.PROD_COMPOSE}} logs -f --tail=200 api'
