services:
    finance-db:
        image: postgres:18.3-bookworm
        container_name: finance_db
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
        restart: always
    finance-app:
        container_name: finance-app
        build:
            context: ${PROJECT_ROOT}
            dockerfile: ${PROJECT_ROOT}/cmd/finance-app/Dockerfile
        ports:
            - 8080:8080
        depends_on:
            - finance-db

    postgres-migrate:
        image: migrate/migrate:v4.19.1
        volumes:
            - ${PROJECT_ROOT}/migrations:/migrations

    postgres-port-forwarder:
        image: alpine/socat:1.8.0.3
        container_name: postgres-port-forwarder
        command: 'tcp-listen:5432,reuseaddr,fork tcp-connect:finance-db:5432'
        ports:
            - '127.0.0.1:5432:5432'
        depends_on:
            - finance-db
