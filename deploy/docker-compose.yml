services:
    auth-db:
        image: postgres:18.3-bookworm
        container_name: auth-db
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
        restart: always
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 2s
            timeout: 3s
            retries: 30
        networks:
            - auth-network
    redis:
        image: redis:8.2-bookworm
        container_name: redis
        volumes:
            - redis-data:/data
            - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
        command:
            [
                'redis-server',
                '/usr/local/etc/redis/redis.conf',
                '--requirepass',
                '${REDIS_PASSWORD:-redis}',
            ]
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 512M
                reservations:
                    cpus: '0.25'
                    memory: 256M
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '$${REDIS_PASSWORD}', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpassword}
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'
        sysctls:
            - net.core.somaxconn=65535
        networks:
            - auth-network

    auth-app:
        container_name: auth-app
        build:
            context: ${PROJECT_ROOT}
            dockerfile: ${PROJECT_ROOT}/cmd/auth/Dockerfile
        ports:
            - 8080:8080
        depends_on:
            - auth-db
        networks:
            - auth-network

    postgres-migrate:
        image: migrate/migrate:v4.19.1
        volumes:
            - ${PROJECT_ROOT}/migrations:/migrations
        networks:
            - auth-network

    postgres-port-forwarder:
        image: alpine/socat:1.8.0.3
        container_name: postgres-port-forwarder
        command: 'tcp-listen:5432,reuseaddr,fork tcp-connect:auth-db:5432'
        ports:
            - '127.0.0.1:5432:5432'
        depends_on:
            - auth-db
        networks:
            - auth-network

    redis-port-forwarder:
        image: alpine/socat:1.8.0.3
        container_name: redis-port-forwarder
        command: 'tcp-listen:6379,reuseaddr,fork tcp-connect:redis:6379'
        ports:
            - '127.0.0.1:6379:6379'
        depends_on:
            - redis
        networks:
            - auth-network

networks:
    auth-network:
        driver: bridge

volumes:
    redis-data:
