# Network
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511

# Memory
maxmemory 450mb
maxmemory-policy volatile-ttl
maxmemory-samples 5

# Persistence
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000

# Performance
tcp-keepalive 300
timeout 0

# Lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Logging
loglevel notice
logfile ""