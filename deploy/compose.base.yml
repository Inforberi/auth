name: ${APP_NAME:?APP_NAME is required}
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.2-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: [migrate, '-path=/migrations', '-database=${MIGRATION_DATABASE_URL:-${DATABASE_URL}}']
    command: [up]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
volumes:
  postgres-data:
  redis-data:
