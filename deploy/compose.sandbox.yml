# Только локальные synthetic data; запускать через task sandbox:up, не с .env/.env.prod.
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: sandbox-owner-only
  redis:
    environment:
      REDIS_PASSWORD: sandbox-redis-only
  migrate:
    entrypoint: [migrate, '-path=/migrations', '-database=postgres://auth:sandbox-owner-only@postgres:5432/auth?sslmode=disable&search_path=public']
  api:
    image: auth:sandbox
    build:
      context: .
      dockerfile: deploy/Dockerfile.prod
    user: '${SANDBOX_UID:?Run task sandbox:up}:${SANDBOX_GID:?Run task sandbox:up}'
    env_file: [.env.example]
    environment:
      APP_ENV: test
      PORT: '8443'
      LOG_LEVEL: info
      DATABASE_URL: postgres://auth_runtime:sandbox-runtime-only@postgres:5432/auth?sslmode=disable
      REDIS_HOST: redis
      REDIS_PASSWORD: sandbox-redis-only
      MFA_ENABLED: 'true'
      INITIAL_SETUP_ENABLED: 'true'
      INITIAL_SETUP_SECRET: U1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1M
      EMAIL_OTP_ENABLED: 'true'
      ACCESS_CATALOG_FILE: /sandbox-catalog.json
      AUTH_ALLOWED_ORIGINS: https://localhost:18443
      HTTP_TLS_CERT_FILE: /sandbox/tls.crt
      HTTP_TLS_KEY_FILE: /sandbox/tls.key
      SWAGGER_ENABLED: 'true'
      SWAGGER_USERNAME: sandbox
      SWAGGER_PASSWORD: sandbox-swagger-only
      SMTP_HOST: mailpit
      SMTP_FROM: auth@example.test
      SMTP_DOMAIN: example.test
      PASSWORD_RESET_URL: https://localhost:18443/reset-password
      EMAIL_VERIFICATION_URL: https://localhost:18443/verify-email
    ports: ['127.0.0.1:18443:8443']
    volumes:
      - ./deploy/sandbox/access-catalog.json:/sandbox-catalog.json:ro
      - type: bind
        source: ./tmp/sandbox/tls.crt
        target: /sandbox/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tmp/sandbox/tls.key
        target: /sandbox/tls.key
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ['127.0.0.1:18026:8025']
